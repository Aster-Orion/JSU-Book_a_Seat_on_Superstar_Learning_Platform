# 超星图书馆座位自动预约工作流
# 触发条件：
#   1. 定时：每天北京时间 06:00（GitHub Actions 的 cron 基于 UTC，故写为 22:00）
#   2. 手动：在 GitHub 仓库 Actions 页面点击 "Run workflow" 手动触发
name: 超星图书馆座位自动预约

on:
  schedule:
    # 北京时间每天早上 06:00 = UTC 前一天 22:00
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      method:
        description: "运行模式（reserve=正式预约，debug=单次调试并发送邮件）"
        required: false
        default: "reserve"
        type: choice
        options:
          - reserve
          - debug

permissions:
  contents: read

jobs:
  reserve:
    name: 执行座位预约
    runs-on: ubuntu-latest
    # 预约循环从 06:00 持续到 08:01（约 2 小时），默认 360 分钟已足够
    timeout-minutes: 300

    env:
      # 账号密码从仓库 Secrets 读取，逗号分隔，与 config.json 中 reserve 列表顺序一一对应
      USERNAMES: ${{ secrets.USERNAMES }}
      PASSWORDS: ${{ secrets.PASSWORDS }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 生成配置文件 config.json
        env:
          # 完整的 config.json 内容（含房间/座位/时段/邮件配置），存放在 Secrets 中
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}
        run: |
          printf '%s' "$CONFIG_JSON" > config.json

      - name: 执行预约
        run: python main.py -a -m "${{ github.event.inputs.method || 'reserve' }}"
